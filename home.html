                <a href="project.html" class="card">我的项目</a>
                <a href="artcle.html" class="card">我的文章</a>

        <div class="main"><!--主体-->
            <div id="sign" class="qianmingtu"></div>
            <div class="hexin"><!--这个是首页的文字部分-->
                <h1 id="title"></h1>
            </div>
            <h1 class="ctext2">_LS_</h1>
            <h1 class="ctext">_LS_</h1>
            <h1 class="ctext">_LS_</h1>

        <script>
            let title=document.getElementById("title");
            let text="欢迎来到我的网站";
            let i=0;
            function type(){//打字
                if(i<text.length){
                    title.innerHTML+=text[i];
                    i++;
                    setTimeout(type,300);
                }
            }
            type();
        </script>
        <script type="module" src="cube.js"></script>
        <script type="module">
            import {initCube} from './cube.js';
            initCube("sign");
        </script>
        <script>
            const faulttext={
                player:{},
                texts:[],
                init(){
                    this.texts=[...document.getElementsByClassName('ctext')];
                },
                fault(){
                    this.player=setInterval(()=>{
                        this.texts.forEach((text)=>{
                            text.style.transform=`translate(${Math.random()*20-10}%,${Math.random()*20-10}%)`;
                            let x=Math.random()*100;
                            let y=Math.random()*100;
                            let w=Math.random()*50+50;
                            let h=Math.random()*50+50;
                            text.style.clipPath=`polygon(${x}% ${y}%,${x+w}% ${y}%,${x+w}% ${y+h}%,${x}% ${y+h}%)`;
                        })
                    },100);
                }
            };
            faulttext.init();
            faulttext.fault();
        </script>
    </body>
