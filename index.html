<html>
    <head>
        <meta charset="utf-8">
        <title>地球牢尸个人网站-首页</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="cg">
                <a href="about.html" class="card">个人介绍</a>
                <a href="project.html" class="card">我的项目</a>
                <a href="artcle.html" class="card">我的文章</a>
            </div>
        <div class="main"><!--主体-->
            <div id="sign" class="qianmingtu"></div>
            <div class="hexin"><!--这个是首页的文字部分-->
                <h1 id="title"></h1>
                <h2>@地球牢尸</h2>
            </div>
        </div>
        <footer class="foot">
            <p>developed by diqiulaoshi</p>
            <p>@2026 地球牢尸.保留所有权利</p>
            <p>联系我:</p>
            <p>邮箱:diqiulaoshi@hotmail.com/QQ:qwerdqls</p>
        </footer>
        <script>
            let title=document.getElementById("title");
            let text="欢迎来到我的网站";
            let i=0;
            function type(){//打字
                if(i<text.length){
                    title.innerHTML+=text[i];
                    i++;
                    setTimeout(type,300);
                }
            }
            type();
        </script>
        <script type="module">
            import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
            //
            const canvas=document.getElementById("sign");
            const w=canvas.clientWidth;
            const h=canvas.clientHeight;
            //
            const scene=new THREE.Scene();
            const camera=new THREE.PerspectiveCamera(45,w/h,0.1,1000);
            camera.position.set(0,0,2.5);
            camera.lookAt(0,0,0);
            //
            const renderer=new THREE.WebGLRenderer({alpha:true});//透明背景
            renderer.setSize(w,h);
            renderer.setClearColor(0x000000,0);//背景透明
            canvas.appendChild(renderer.domElement);
            //
            const ambientlight=new THREE.AmbientLight(0x404060);
            scene.add(ambientlight);
            const dirlight=new THREE.DirectionalLight(0xffffff,1);
            dirlight.position.set(2,3,4);
            scene.add(dirlight);
            const backLight=new THREE.DirectionalLight(0xff44ff,0.5);
            backLight.position.set(-2,1,-3);
            scene.add(backLight);
            //
            const loader=new THREE.TextureLoader();
            const sign=loader.load("sign1.png");
            sign.colorSpace=THREE.SRGBColorSpace;
            //
            const frontMaterial=new THREE.MeshStandardMaterial({map:sign,metalness:0.2,roughness:0.3});
            const colors=[0x3DF8F8,0xE23AFB,0x74FF01,0x0E48C1];
            const color=colors.map(c=>new THREE.MeshStandardMaterial({color:c,metalness:0.7,roughness:0.3}));
            const materials=[
                color[0],
                color[1],
                color[2],
                color[3],
                frontMaterial,
                color[0]
            ];
            //
            const geometry=new THREE.BoxGeometry(1.1,1.1,1.1);
            const cube=new THREE.Mesh(geometry,materials);
            scene.add(cube);
            //
            function animate(){
                requestAnimationFrame(animate);
                cube.rotation.x+=0.01;
                cube.rotation.y+=0.01;
                //cube.rotation.z+=0.01;
                renderer.render(scene,camera);
            }
            animate();
            window.addEventListener('resize', () => {
                const newWidth = canvas.clientWidth;
                const newHeight = canvas.clientHeight;
                renderer.setSize(newWidth, newHeight);
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
            });
        </script>
    </body>
</html>
