<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>粒子炸开</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background: #0b0b16;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            max-width: 800px;
            max-height: 500px;
            background: #10101c;
            cursor: pointer;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        // ===== 极简粒子炸开（带渐显） =====
        const c = document.getElementById('c'),
            ctx = c.getContext('2d');
        let W, H, pts = [],
            exploded = false,
            prog = 0,
            target = 0;
        let fadeIn = true,
            fadeInProg = 0; // 渐显状态

        function resize() {
            const r = c.getBoundingClientRect();
            const dpr = devicePixelRatio || 1;
            W = r.width;
            H = r.height;
            c.width = W * dpr;
            c.height = H * dpr;
            c.style.width = W + 'px';
            c.style.height = H + 'px';
            ctx.scale(dpr, dpr);
            if (pts.length) loadLogo();
        }

        function loadLogo() {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                const off = document.createElement('canvas');
                off.width = img.width;
                off.height = img.height;
                const octx = off.getContext('2d');
                octx.drawImage(img, 0, 0);
                const data = octx.getImageData(0, 0, img.width, img.height).data;
                const w = img.width,
                    h = img.height;
                const step = 2;
                const pixels = [];
                for (let y = 0; y < h; y += step) {
                    for (let x = 0; x < w; x += step) {
                        const idx = (y * w + x) * 4;
                        const a = data[idx + 3];
                        if (a > 30) {
                            const r = data[idx],
                                g = data[idx + 1],
                                b = data[idx + 2];
                            const bright = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                            pixels.push({ x, y, a: a / 255, bright });
                        }
                    }
                }
                let maxP = 6000;
                if (pixels.length > maxP) {
                    for (let i = pixels.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [pixels[i], pixels[j]] = [pixels[j], pixels[i]];
                    }
                    pixels.length = maxP;
                }
                const sx = W / w,
                    sy = H / h;
                pts = pixels.map(p => {
                    const ox = p.x * sx,
                        oy = p.y * sy;
                    const ang = Math.random() * 6.2832,
                        dist = 0.3 + Math.random() * 0.7;
                    const rad = Math.min(W, H) * 0.55 * dist;
                    return {
                        ox,
                        oy,
                        tx: ox + Math.cos(ang) * rad,
                        ty: oy + Math.sin(ang) * rad,
                        x: ox,
                        y: oy,
                        size: 1.5 + (1 - p.bright) * 2 + Math.random() * 1.5,
                        delay: Math.random() * 0.5,
                        phase: Math.random() * 100,
                    };
                });
                // 重置为聚集态 + 渐显开始
                exploded = false;
                target = 0;
                prog = 0;
                fadeIn = true;
                fadeInProg = 0;
                pts.forEach(p => { p.x = p.ox;
                    p.y = p.oy });
            };
            img.onerror = () => console.error('请将 logo.png 放在同目录');
            img.src = 'logo.png';
        }

        function toggle() {
            if (!pts.length) return;
            // 如果正在渐显，立即完成渐显并炸开
            if (fadeIn) {
                fadeIn = false;
                fadeInProg = 1;
                exploded = true;
                target = 1;
                return;
            }
            exploded = !exploded;
            target = exploded ? 1 : 0;
        }
        c.onclick = toggle;

        function anim() {
            // 渐显逻辑
            if (fadeIn) {
                fadeInProg += 0.018;
                if (fadeInProg >= 1) {
                    fadeInProg = 1;
                    fadeIn = false;
                    // 渐显完成 → 自动炸开
                    exploded = true;
                    target = 1;
                }
            }

            // 更新进度
            prog += (target - prog) * 0.045;
            prog = Math.max(0, Math.min(1, prog));
            const ease = prog < 0.5 ? 4 * prog * prog * prog : 1 - Math.pow(-2 * prog + 2, 3) / 2;
            const t = Date.now() / 1000;
            // 更新粒子位置
            for (const p of pts) {
                let d = Math.max(0, Math.min(1, (ease - p.delay * 0.4) / (1 - 0.4)));
                if (target === 0) d = Math.max(0, Math.min(1, (ease - (1 - p.delay) * 0.3) / (1 - 0.3)));
                const jit = d * 0.6 + 0.2;
                const jx = (Math.sin(t * 1.3 + p.phase) * 0.5 + Math.cos(t * 0.7 + p.phase * 1.2) * 0.5) * jit;
                const jy = (Math.cos(t * 0.9 + p.phase * 0.8) * 0.5 + Math.sin(t * 1.1 + p.phase * 1.4) * 0.5) * jit;
                p.x = p.ox + (p.tx - p.ox) * d + jx;
                p.y = p.oy + (p.ty - p.oy) * d + jy;
                p.size = (1.5 + (1 - p.bright) * 2 + 1.5 * Math.random()) * (1 - d * 0.3);
            }

            // 绘制
            ctx.clearRect(0, 0, W, H);
            const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
            bg.addColorStop(0, 'rgba(30,28,50,0.4)');
            bg.addColorStop(1, 'rgba(8,8,16,0)');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            const fadeAlpha = fadeIn ? fadeInProg : 1; // 渐显透明度系数
            for (const p of pts) {
                const s = Math.max(0.4, p.size);
                const alpha = Math.min(1, s / 2) * 0.9 * fadeAlpha;
                if (alpha < 0.01) continue;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#fff';
                if (prog > 0.15 && s > 1.8 && !fadeIn) {
                    ctx.shadowColor = 'rgba(255,255,255,0.4)';
                    ctx.shadowBlur = s * 3;
                } else ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, s, 0, 6.2832);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(anim);
        }

        window.onresize = () => { resize();
            loadLogo(); };
        resize();
        loadLogo();
        anim();
        console.log('图片渐显后自动炸开，点击切换');
    </script>
</body>
</html>
